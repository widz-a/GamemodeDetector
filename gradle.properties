loader_version=0.19.3

# Dependencies
fabric_version=0.155.2+26.1.2
#https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu
modmenu_verson=18.0.0
#https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/
cloth_version=26.1.154
#https://maven.xpple.dev/maven2/dev/xpple/clientarguments/
# 1.12.0 is the 26.1.x build (1.13.x targets 26.2+)
clientargs_version=1.12.0
